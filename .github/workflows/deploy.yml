name: Deploy neomd

on:
  push:
    branches:
      - main
    paths:
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'internal/**'
      - 'cmd/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-gpu
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build
        run: make build

      - name: Install
        run: |
          if [ -e /home/jon/.local/bin/neomd ]; then cp /home/jon/.local/bin/neomd /home/jon/.local/bin/neomd.prev; fi
          install -Dm755 neomd /home/jon/.local/bin/neomd

      - name: Verify deployed binary
        run: |
          expected="$(git describe --tags --always --dirty)"
          actual="$(/home/jon/.local/bin/neomd --version)"
          test "$actual" = "neomd $expected" || {
            echo "version mismatch: expected 'neomd $expected', got '$actual'" >&2
            exit 1
          }
